<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a16"/>
      <stop offset="100%" stop-color="#222222"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a24"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g stroke="#33332e" stroke-width="1" opacity="0.15">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>

  <!-- Accent glow -->
  <circle cx="1100" cy="320" r="180" fill="#78824b" opacity="0.10" filter="url(#glow)"/>
  <circle cx="100" cy="80" r="140" fill="#e4c47a" opacity="0.06" filter="url(#glow)"/>

  <!-- Left panel -->
  <rect x="60" y="110" width="420" height="200" rx="16" fill="url(#cardGrad)" stroke="#78824b" stroke-width="2"/>

  <!-- Title -->
  <text x="100" y="155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#c2c2b0" letter-spacing="-1">Green-Rice</text>
  <text x="100" y="190" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#78824b" font-weight="600">Miasma Hyprland Rice  ·  Ultra-Smart TUI Installer</text>

  <text x="100" y="225" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a7e">Build · Link · Verify · Rollback</text>

  <!-- Palette swatches -->
  <g transform="translate(100, 255)">
    <rect x="0" y="0" width="34" height="34" rx="6" fill="#222222" stroke="#c2c2b0" stroke-width="1"/>
    <text x="46" y="25" font-size="12" fill="#c2c2b0" font-family="monospace">#222222 bg</text>
    <rect x="120" y="0" width="34" height="34" rx="6" fill="#78824b" stroke="#c2c2b0" stroke-width="1"/>
    <text x="166" y="25" font-size="12" fill="#c2c2b0" font-family="monospace">#78824b accent</text>
    <rect x="240" y="0" width="34" height="34" rx="6" fill="#e4c47a" stroke="#c2c2b0" stroke-width="1"/>
    <text x="286" y="25" font-size="12" fill="#101010" font-family="monospace">#e4c47a highlight</text>
    <rect x="360" y="0" width="34" height="34" rx="6" fill="#c2c2b0" stroke="#c2c2b0" stroke-width="1"/>
    <text x="406" y="25" font-size="12" fill="#101010" font-family="monospace">#c2c2b0 fg</text>
  </g>

  <!-- Right panel: TUI preview -->
  <rect x="520" y="110" width="620" height="200" rx="16" fill="url(#cardGrad)" stroke="#e4c47a" stroke-width="1"/>

  <text x="560" y="145" font-size="14" font-weight="700" fill="#c2c2b0" font-family="monospace">green-rice-install  v1.0.0</text>
  <text x="560" y="165" font-size="12" fill="#8a8a7e" font-family="monocode">TUI · system detect · backup · install · verify · rollback</text>

  <!-- Menu items -->
  <g font-family="monospace" font-size="13">
    <text x="560" y="195" fill="#c2c2b0">▸ [x] packages   hyprland, kitty, waybar, wofi, fonts…</text>
    <text x="560" y="215" fill="#c2c2b0">▸ [x] fonts      JetBrainsMono NF + Noto Color Emoji</text>
    <text x="560" y="235" fill="#78824b">▸ [x] dotfiles   build + link into ~/.config</text>
    <text x="560" y="255" fill="#c2c2b0">▸ [ ] hypr-lua   Hyprland Lua theme sync</text>
    <text x="560" y="275" fill="#c2c2b0">▸ [ ] firefox    userChrome + dark prefs</text>
    <text x="560" y="295" fill="#8a8a7e">▸ [ ] verify     post-install checks</text>
  </g>

  <!-- Progress bar -->
  <rect x="560" y="310" width="300" height="10" rx="5" fill="#33332e"/>
  <rect x="560" y="310" width="210" height="10" rx="5" fill="#78824b"/>
  <text x="875" y="319" font-size="11" fill="#8a8a7e" font-family="monospace">70%</text>

  <!-- Bottom tagline -->
  <text x="60" y="375" font-size="13" fill="#8a8a7e" font-family="Segoe UI, Roboto, sans-serif" style="font-style:italic">Because your desktop should install itself.</text>
</svg>
