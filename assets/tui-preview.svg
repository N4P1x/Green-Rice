<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151511"/>
      <stop offset="100%" stop-color="#222222"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a24"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="620" fill="url(#bg)"/>

  <!-- Title bar -->
  <rect x="60" y="40" width="880" height="44" rx="8" fill="#101010" stroke="#78824b" stroke-width="1"/>
  <circle cx="84" cy="62" r="6" fill="#e4c47a"/>
  <circle cx="100" cy="62" r="6" fill="#bb7744"/>
  <circle cx="116" cy="62" r="6" fill="#78824b"/>
  <text x="140" y="62" font-size="13" fill="#8a8a7e" font-family="monospace">green-rice-install — TUI Installer</text>

  <!-- Terminal body -->
  <rect x="60" y="84" width="880" height="470" rx="8" fill="url(#win)" stroke="#33332e" stroke-width="1"/>

  <!-- Header -->
  <rect x="80" y="110" width="180" height="24" rx="4" fill="#1a1a16"/>
  <text x="90" y="128" font-size="12" fill="#78824b" font-family="monospace">System Detected</text>

  <text x="80" y="160" font-size="13" fill="#c2c2b0" font-family="monospace">Distro:    Arch Linux (arch)</text>
  <text x="80" y="182" font-size="13" fill="#c2c2b0" font-family="monospace">WM:        Hyprland 0.57.0 (Wayland)</text>
  <text x="80" y="204" font-size="13" fill="#c2c2b0" font-family="monospace">Shell:     bash  ·  User: n4p1</text>
  <text x="80" y="226" font-size="13" fill="#c2c2b0" font-family="monospace">Packages:  pacman / yay (AUR)</text>
  <text x="80" y="248" font-size="13" fill="#c2c2b0" font-family="monospace">Sudo:      passwordless = no</text>
  <text x="80" y="270" font-size="13" fill="#c2c2b0" font-family="monospace">Fonts:     JetBrainsMono NF + Noto Emoji</text>

  <!-- Palette swatches -->
  <g transform="translate(80, 300)">
    <rect x="0" y="0" width="26" height="26" rx="4" fill="#222222" stroke="#c2c2b0"/>
    <text x="34" y="19" font-size="11" fill="#c2c2b0" font-family="monospace">#222222 bg</text>
    <rect x="120" y="0" width="26" height="26" rx="4" fill="#78824b" stroke="#c2c2b0"/>
    <text x="154" y="19" font-size="11" fill="#c2c2b0" font-family="monospace">#78824b accent</text>
    <rect x="240" y="0" width="26" height="26" rx="4" fill="#e4c47a" stroke="#c2c2b0"/>
    <text x="274" y="19" font-size="11" fill="#101010" font-family="monospace">#e4c47a highlight</text>
    <rect x="350" y="0" width="26" height="26" rx="4" fill="#c2c2b0" stroke="#c2c2b0"/>
    <text x="384" y="19" font-size="11" fill="#101010" font-family="monospace">#c2c2b0 fg</text>
  </g>

  <!-- Component menu -->
  <rect x="80" y="350" width="840" height="170" rx="8" fill="#1a1a16" stroke="#33332e"/>
  <text x="100" y="372" font-size="13" fill="#78824b" font-weight="700" font-family="monospace">Select components to install:</text>
  <g font-family="monospace" font-size="13">
    <text x="100" y="398" fill="#c2c2b0">[x] packages    hyprland, kitty, waybar, wofi, mako, fonts…</text>
    <text x="100" y="420" fill="#c2c2b0">[x] fonts       JetBrainsMono NF + Noto Color Emoji (user-local)</text>
    <text x="100" y="442" fill="#78824b" font-weight="700">[x] dotfiles    build + link into ~/.config</text>
    <text x="100" y="464" fill="#c2c2b0">[ ] hypr-lua    Hyprland Lua theme + keybind sync</text>
    <text x="100" y="486" fill="#c2c2b0">[ ] firefox     userChrome.css + dark-theme prefs</text>
    <text x="100" y="508" fill="#c2c2b0">[x] verify      post-install pass/fail checks</text>
  </g>

  <!-- Footer hint -->
  <text x="80" y="548" font-size="12" fill="#8a8a7e" font-family="monospace">Tip: number to toggle  ·  a = all  ·  n = none  ·  d = done</text>
  <text x="780" y="548" font-size="12" fill="#8a8a7e" font-family="monospace">v1.0.0  ·  idempotent · rollback-ready</text>
</svg>
