# Miasma canonical palette — single source of truth.
# Hex values are stored WITHOUT the leading '#'.
# Templates reference colors as {{key}} and decimal RGB as {{dec:key}}.

# --- surfaces -------------------------------------------------------------
bg           222222   # base background (cellar grey)
bg_darker    101010   # deepest scrim/shadow layer
bg_dark      151515   # tooltip / locked / polkit surfaces
bg_lighter   242d1d   # emphasized panels / cursorline (olive-tinted)
bg_panel     1c1c1c   # bars, popups, launcher surfaces

# --- text -----------------------------------------------------------------
fg           c2c2b0   # primary foreground (pale linen)
fg_muted     8a8a7e   # secondary / dim text
fg_dim       666666   # disabled text, line numbers, comments
fg_bright    d7c483   # highlights, cursor, bright foreground (pale gold)

# --- accent ---------------------------------------------------------------
accent       78824b   # olive — interactive accent, active states
accent_dark  3c4125   # dark end of active border gradient
accent_mid   43492a   # dark end of inactive border gradient
border_angle 35       # angular border gradient, degrees

# --- selection ------------------------------------------------------------
# selection: text selection inside editors/terminals
# highlight: highlighted/active item in widgets (black-on-gold for contrast)
selection    383838
selection_fg c2c2b0
highlight    e4c47a
highlight_fg 000000

# --- ANSI 16 ---------------------------------------------------------------
black         000000
red           685742
green         5f875f
yellow        b36d43
blue          78824b
magenta       bb7744
cyan          c9a554
white         c2c2b0
orange        b36d43
purple        78824b
brown         685742

bright_black   666666
bright_red     685742
bright_green   5f875f
bright_yellow  b36d43
bright_blue    78824b
bright_magenta bb7744
bright_cyan    c9a554
bright_white   d7c483

# --- misc ------------------------------------------------------------------
cursor        d7c483   # terminal cursor — same as fg_bright
player_cursor c7c7c7   # editor multi-cursor (others' cursors)